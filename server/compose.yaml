services:
  astrbot:
    image: soulter/astrbot:latest
    container_name: astrbot
    restart: always
    environment:
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:6185:6185"
      # proactive_chat 插件控制台（心跳判据与收件人切换都要用它）
      # 注意：容器内必须绑 0.0.0.0，否则 host 的端口映射打不进去（见 migrate_config.py）
      - "127.0.0.1:4100:4100"
    volumes:
      - ./astrbot/data:/AstrBot/data
    networks: [miruku]

  napcat:
    image: mlikiowa/napcat-docker:latest
    container_name: napcat
    restart: unless-stopped
    environment:
      - MODE=reverse_ws
      - ONEBOT_URL=ws://astrbot:6199/ws
      - WEBUI_TOKEN=${NAPCAT_WEBUI_TOKEN}
      # 有值则 entrypoint 走 `qq -q <uin>` 快速登录（免扫码）；空则回落二维码
      - ACCOUNT=${NAPCAT_ACCOUNT:-}
      - TZ=Asia/Shanghai
    ports:
      - "127.0.0.1:6099:6099"
    volumes:
      - ./napcat/qq:/app/.config/QQ
      - ./napcat/config:/app/napcat/config
      - ./napcat/plugins:/app/napcat/plugins
    depends_on: [astrbot]
    networks:
      miruku:
        # 钉死 MAC：NTQQ 登录态与设备信息绑定，容器 recreate 换 MAC 会让
        # 快速登录报「登录态已失效，请重新登录」（2026-10-26 实测：
        # 23:10 扫码登录 → 23:39 recreate 换 MAC → 快速登录失效）。
        # 官方 NapCat-Docker 模板里注释掉的 mac_address 就是同一用途。
        mac_address: "1e:b1:b3:26:2f:25"

networks:
  miruku:
    driver: bridge
